name: Forecast models

on:
  schedule:
    - cron: "20 9 * * *"
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      force_map:
        description: "Draw the map even if no storm is coming (for testing)"
        type: boolean
        default: false

jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Download models, draw the map and send to the site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          WIS_MODELS_KEY: ${{ secrets.WIS_MODELS_KEY }}
          FORCE_MAP: ${{ github.event.inputs.force_map || 'false' }}
        run: python models.py
      - name: Keep the map for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map
          path: |
            out/map.mp4
            out/map.gif
            out/map.png
          if-no-files-found: ignore
          retention-days: 7
